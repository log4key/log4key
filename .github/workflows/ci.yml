name: CI

on:
  push:
    branches: ["master"]
    tags:
      - 'v[0-9]*'          # log4key-all 发布（如 v0.3.2）
      - 'starter-v[0-9]*'  # log4key-spring-boot-starter 发布（如 starter-v0.1.1）
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: '发布目标（手动补发/重发时使用）'
        required: true
        type: choice
        options:
          - all
          - starter
      version:
        description: '版本号，如 0.3.2 或 0.1.1'
        required: true
        type: string

jobs:
  # =========================================================
  # 构建 + 测试（作为发布的前置门；失败则不发布）
  # =========================================================
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. 拉取代码
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2. 安装 Java 8
      # -------------------------
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # -------------------------
      # 3. 赋执行权限给 gradlew
      # -------------------------
      - name: Grant execute permission
        run: chmod +x gradlew

      # -------------------------
      # 4. 缓存 Gradle 构建
      # -------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}

      # -------------------------
      # 5. 编译 + 测试
      # -------------------------
      - name: Build with Gradle
        run: ./gradlew build

  # =========================================================
  # 发布 log4key-all（仅 v* tag 或手动 target=all）
  # =========================================================
  publish-all:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'all')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # 只发布 log4key-all 这一个 publication（插件按项目生效，根项目任务名无 Repository 后缀）
      - name: Publish log4key-all to Maven Central
        run: ./gradlew publishMavenJavaPublicationToMavenCentral -Plog4keyVersion=${{ steps.ver.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build GitHub Release jar
        run: ./gradlew githubBuild

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}

  # =========================================================
  # 发布 log4key-spring-boot-starter（仅 starter-v* tag 或手动 target=starter）
  # =========================================================
  publish-starter:
    needs: build
    if: startsWith(github.ref, 'refs/tags/starter-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'starter')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == starter-v* ]]; then
            echo "version=${REF#starter-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # 只发布 starter 这一个 publication（starter 项目自身应用了 Central 插件，项目限定任务）
      - name: Publish starter to Maven Central
        run: ./gradlew :log4key-spring-boot-starter:publishStarterPublicationToMavenCentral -PstarterVersion=${{ steps.ver.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build starter jars for GitHub Release
        run: ./gradlew :log4key-spring-boot-starter:jar :log4key-spring-boot-starter:sourcesJar :log4key-spring-boot-starter:javadocJar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: log4key-spring-boot-starter/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
